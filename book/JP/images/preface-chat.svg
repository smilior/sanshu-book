<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 680" width="1000" height="680">
  <rect width="1000" height="680" fill="#FFFEFA"/>
  <rect x="70" y="28" width="860" height="624" rx="16" fill="#FFFEFA" stroke="#c8c4bc" stroke-width="2"/>
