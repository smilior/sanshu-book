  <text x="104" y="70" fill="#3A3630" font-family="Noto Sans CJK JP, sans-serif" font-size="24" font-weight="700">長い案件のスレッド</text>
  <rect x="760" y="48" width="146" height="32" rx="16" fill="#FFFEFA" stroke="#c8c4bc"/>
  <text x="833" y="70" text-anchor="middle" fill="#6e6a64" font-family="Noto Sans CJK JP, sans-serif" font-size="16">1つのチャット</text>

  <rect x="430" y="124" width="460" height="64" rx="14" fill="#f3f1ec" stroke="#d8d4cc"/>
  <text x="454" y="164" fill="#3A3630" font-family="Noto Sans CJK JP, sans-serif" font-size="22">これ、やる？</text>

  <rect x="110" y="212" width="520" height="72" rx="14" fill="#FFFEFA" stroke="#c8c4bc" stroke-width="1.5"/>
  <text x="134" y="256" fill="#3A3630" font-family="Noto Sans CJK JP, sans-serif" font-size="22">ボタンを右に寄せた差分です</text>

  <rect x="390" y="308" width="500" height="64" rx="14" fill="#f3f1ec" stroke="#d8d4cc"/>
