  <line x1="110" y1="520" x2="890" y2="520" stroke="#d8d4cc" stroke-width="1.5"/>
  <text x="500" y="572" text-anchor="middle" fill="#5a5550" font-family="Noto Sans CJK JP, sans-serif" font-size="20">最終の一文は残っていない。決める話と作る話が並んでいる</text>
  <rect x="848" y="592" width="52" height="36" rx="18" fill="#2f9e5f"/>
  <text x="874" y="616" text-anchor="middle" fill="#FFFEFA" font-family="Noto Sans CJK JP, sans-serif" font-size="16">送信</text>
